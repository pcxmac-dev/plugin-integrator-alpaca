[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-integrator-alpaca"
version = "0.3.0"  # the plugin's own release (CHANGELOG.md; on release/0.2.0 with Liminal's release); the app shows it on the Plugins view
description = "Alpaca for Liminal: US stock and crypto bars and streams on Alpaca's API, with its overnight feed on Blue Ocean."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (plugin API 2.2, the API cards: liminal-libs 1.49.0); which app releases can load it is
# the plugin API the feeds declare (their api, checked when the app loads it), not this line
dependencies = ["liminal-libs>=1.49.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
alpaca = "plugin_integrator_alpaca"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
